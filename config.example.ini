[DEFAULT]
SCRAPED_WEBSITE_USER = your_email@example.com
SCRAPED_WEBSITE_PASSWORD = your_password
# Comma-separated 'name:token' pairs, one per Pushbullet recipient. Works for
# a single recipient too. Each token is that person's own private Pushbullet
# access token; the name is only used to identify them in logs.
# See README "Notify multiple people" section for setup steps.
PUSHBULLET_API_KEYS = You:your_pushbullet_api_key
TRANSLATION_LANGUAGE = en
DIGEST_ENABLED = true

# --- LLM backend (only used when DIGEST_ENABLED = true) ----------------------
# Translation mode (DIGEST_ENABLED = false) never touches any of these.
#   copilot            -> GitHub Copilot CLI (default; must be installed & authenticated)
#   openai_compatible  -> any OpenAI-compatible /chat/completions endpoint
LLM_PROVIDER = copilot

# Only needed when LLM_PROVIDER = openai_compatible.
# Local Ollama (free, private, stays on your network):
#   LLM_BASE_URL = http://localhost:11434/v1
#   LLM_MODEL    = llama3.1
#   LLM_API_KEY  =                     ; leave blank for local Ollama
# OpenRouter / other cloud provider:
#   LLM_BASE_URL = https://openrouter.ai/api/v1
#   LLM_MODEL    = openai/gpt-4o-mini
#   LLM_API_KEY  = your_api_key
LLM_BASE_URL =
LLM_MODEL =
LLM_API_KEY =
LLM_TIMEOUT = 120
