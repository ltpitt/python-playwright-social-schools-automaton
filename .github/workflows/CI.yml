name: CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: pip install -r requirements-dev.txt
    # No `playwright install`: nothing in the suite drives a real browser, and
    # the application resolves a system Chromium at runtime anyway.
    - name: Lint
      run: make lint
    - name: Test
      run: make test
    - name: Import sanity
      run: python -c "import socialschools.pipeline; print('Import OK')"
