[DEFAULT]
SCRAPED_WEBSITE_USER = your_email@example.com
SCRAPED_WEBSITE_PASSWORD = your_password
PUSHBULLET_API_KEY = your_pushbullet_api_key
TRANSLATION_LANGUAGE = en
DIGEST_ENABLED = true
# Optional: name of the person owning PUSHBULLET_API_KEY, used only to label
# that recipient in logs. Defaults to "primary" if left empty.
PUSHBULLET_API_KEY_OWNER =
# Optional: comma-separated 'name:token' pairs for additional recipients
# (e.g. Partner:abcd1234), each using their own private Pushbullet account.
# The name is only used in logs, to identify who a push went to.
# Leave empty to notify only the account owning PUSHBULLET_API_KEY.
# See README "Notify multiple people" section for setup steps.
PUSHBULLET_EXTRA_API_KEYS =
