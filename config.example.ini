[DEFAULT]
# Social Schools account email used to log in.
SCRAPED_WEBSITE_USER = your_email@example.com

# Social Schools account password used to log in.
SCRAPED_WEBSITE_PASSWORD = your_password

# Comma-separated 'name:token[:language]' pairs, one per Pushbullet recipient.
# Works for a single recipient too. Each token is that person's own private
# Pushbullet access token; the name is only used to identify them in logs.
# The optional trailing ':language' overrides TRANSLATION_LANGUAGE for that
# recipient only (e.g. "Davide:token:it,Daniela:token:en"); omit it to use
# TRANSLATION_LANGUAGE. Each language is only translated/summarized once and
# shared by every recipient who requested it.
# See README "Notify multiple people" section for setup steps.
# Leave empty to disable Pushbullet and use email notifications instead.
PUSHBULLET_API_KEYS = You:your_pushbullet_api_key

# --- Email notifications (Gmail SMTP) ----------------------------------------
# Notifications can be sent by email in addition to (or instead of) Pushbullet.
# Leave EMAIL_RECIPIENTS empty to disable email entirely.
#
# We assume Gmail as the sending provider (smtp.gmail.com). EMAIL_SENDER is the
# Gmail address the emails are sent FROM. EMAIL_APP_PASSWORD is a Gmail *App
# Password* (NOT your normal Google password): enable 2-Step Verification, then
# create one at https://myaccount.google.com/apppasswords
#
# EMAIL_RECIPIENTS is a comma-separated list of 'name:email[:language]' pairs,
# mirroring PUSHBULLET_API_KEYS (including the optional per-recipient
# ':language' override). Each recipient is emailed individually, so their
# address is never exposed to the others. A single entry works too.
EMAIL_SENDER =
EMAIL_APP_PASSWORD =
EMAIL_RECIPIENTS =

# --- Admin alerting ----------------------------------------------------------
# The admin channel receives EVERY error and problem the run hits, including
# ones parents never see (login failures, attachment extraction errors,
# degraded digests, state-file write failures). Both settings are optional and
# independent; leave both empty to disable admin alerting.
#
# ADMIN_PUSHBULLET_API_KEY is a single Pushbullet access token (no 'name:'
# prefix). ADMIN_EMAIL is a single email address and is delivered using the
# EMAIL_SENDER / EMAIL_APP_PASSWORD credentials above.
ADMIN_PUSHBULLET_API_KEY =
ADMIN_EMAIL =


# Output language for parent-facing notifications (e.g. en, it, de, fr).
TRANSLATION_LANGUAGE = en

# --- Browser selection -------------------------------------------------------
# Choose which engine Playwright should use:
#   auto     -> try Chromium first, then Firefox fallback
#   chromium -> force Chromium/Chrome only
#   firefox  -> force Firefox only
BROWSER_ENGINE = auto

# Optional explicit browser binary path. Leave empty for auto-detection.
# Examples:
#   /usr/bin/chromium-browser
#   /usr/bin/firefox
BROWSER_EXECUTABLE_PATH =

# true  -> Digest mode (uses configured LLM backend for TL;DR/action items)
# false -> Translation mode (Google Translate only, no LLM path involved)
DIGEST_ENABLED = true

# --- LLM backend (only used when DIGEST_ENABLED = true) ----------------------
# Translation mode (DIGEST_ENABLED = false) never touches any of these.
#   copilot            -> GitHub Copilot CLI (default; must be installed & authenticated)
#   openai_compatible  -> any OpenAI-compatible /chat/completions endpoint
LLM_PROVIDER = copilot

# Base URL for OpenAI-compatible providers. Leave empty for `copilot`.
# Only needed when LLM_PROVIDER = openai_compatible.
# Local Ollama (free, private, stays on your network):
#   LLM_BASE_URL = http://localhost:11434/v1
#   LLM_MODEL    = llama3.1
#   LLM_API_KEY  =                     ; leave blank for local Ollama
# OpenRouter / other cloud provider:
#   LLM_BASE_URL = https://openrouter.ai/api/v1
#   LLM_MODEL    = openai/gpt-4o-mini
#   LLM_API_KEY  = your_api_key
LLM_BASE_URL =

# Model identifier for the selected OpenAI-compatible backend.
# Examples: llama3.1, qwen2.5:7b, openai/gpt-4o-mini
LLM_MODEL =

# API key for cloud OpenAI-compatible providers (OpenRouter, etc.).
# Keep blank for local Ollama.
LLM_API_KEY = 

# Timeout in seconds for LLM requests (local models may need longer).
LLM_TIMEOUT = 120
